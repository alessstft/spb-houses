<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дома Санкт-Петербурга — реестр ГИС ЖКХ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#1d2733; --muted:#5d6b7a; --line:#d6dde4;
  --neva:#2e4a62; --ochre:#c28a1e; --ochre-soft:#f6ecd6; --row:#f7f9fb;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151b22; --surface:#1d252f; --ink:#e6ebf0; --muted:#97a4b2; --line:#2f3a47;
    --neva:#8fb2cf; --ochre:#e0ac48; --ochre-soft:#3a3020; --row:#222b36;
  }
}
:root[data-theme="dark"]{
  --bg:#151b22; --surface:#1d252f; --ink:#e6ebf0; --muted:#97a4b2; --line:#2f3a47;
  --neva:#8fb2cf; --ochre:#e0ac48; --ochre-soft:#3a3020; --row:#222b36;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 60px}
header h1{font-size:clamp(24px,3.4vw,34px);line-height:1.15;margin:0 0 6px;font-weight:700;color:var(--neva)}
header p{margin:0;color:var(--muted);max-width:70ch}
.facade{height:6px;margin:18px 0 24px;background:repeating-linear-gradient(90deg,var(--ochre) 0 38px,transparent 38px 46px)}
.drop{border:2px dashed var(--line);background:var(--surface);border-radius:10px;padding:26px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--ochre);background:var(--ochre-soft)}
.drop strong{display:block;font-size:17px;margin-bottom:4px}
.drop span{color:var(--muted);font-size:14px}
.drop input{display:none}
.status{margin:12px 0 0;color:var(--muted);font-size:14px;min-height:21px}
.status.err{color:#c0392b}
.panel{display:none;margin-top:22px}
.panel.on{display:block}
.controls{display:grid;grid-template-columns:2fr 1.3fr auto;gap:12px;align-items:end}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=search],select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
input[type=search]:focus,select:focus,button:focus-visible,.drop:focus-visible{outline:3px solid var(--ochre);outline-offset:1px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;padding-bottom:10px;white-space:nowrap}
.summary{display:flex;flex-wrap:wrap;gap:6px 24px;margin:18px 0 10px;font-size:14px;color:var(--muted)}
.summary b{color:var(--ink);font-size:20px;font-weight:600;margin-right:4px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--surface);font-weight:600;color:var(--neva);white-space:nowrap}
tbody tr.r{cursor:pointer}
tbody tr.r:hover{background:var(--row)}
tbody tr.r:focus-visible{outline:2px solid var(--ochre);outline-offset:-2px}
td.addr{min-width:280px}
mark{background:var(--ochre-soft);color:inherit;padding:0 1px;border-radius:2px}
tr.detail td{background:var(--row);padding:14px 16px}
dl{display:grid;grid-template-columns:minmax(160px,280px) 1fr;gap:4px 16px;margin:0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;word-break:break-word}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:14px;color:var(--muted)}
button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 14px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:720px){.controls{grid-template-columns:1fr}.chk{padding-bottom:0}dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Дома Санкт-Петербурга</h1>
    <p>Список домов из реестра объектов жилищного фонда ГИС ЖКХ с поиском по адресу и фильтром по улице.</p>
  </header>
  <div class="facade" aria-hidden="true"></div>

  <label class="drop" id="drop" tabindex="0">
    <strong>Загрузите выгрузку из ГИС ЖКХ</strong>
    <span>Файл spb_houses.csv (свод по домам) или любой CSV/Excel из ГИС ЖКХ. Файл обрабатывается в браузере и никуда не отправляется.</span>
    <input type="file" id="file" accept=".csv,.txt,.xlsx,.xls">
  </label>
  <p class="status" id="status" role="status"></p>

  <section class="panel" id="panel">
    <div class="controls">
      <div>
        <label class="f" for="q">Поиск по адресу</label>
        <input type="search" id="q" placeholder="Например: Невский 28 или Лиговский">
      </div>
      <div>
        <label class="f" for="street">Улица</label>
        <select id="street"><option value="">Все улицы</option></select>
      </div>
      <label class="chk"><input type="checkbox" id="spb" checked> Только Санкт-Петербург</label>
    </div>

    <div class="summary" id="summary"></div>
    <div class="tablebox"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div class="pager">
      <button id="prev">Назад</button><span id="pageinfo"></span><button id="next">Вперёд</button>
    </div>
  </section>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const PAGE = 50;
  let rows = [], cols = [], addrCol = null, showCols = [], filtered = [], page = 0, openIdx = null;

  const STREET_RE = /(улица|ул\.?|проспект|пр-кт|пр\.|переулок|пер\.?|набережная|наб\.?|шоссе|ш\.|бульвар|б-р|площадь|пл\.?|линия|линии|дорога|дор\.?|аллея|проезд|пр-д|тупик|канал|остров|кв-л|квартал)(\s|$|,)/i;

  function setStatus(t, err){ const s=$('status'); s.textContent=t; s.className='status'+(err?' err':''); }

  function decode(buf){
    let t = new TextDecoder('utf-8').decode(buf);
    const bad = (t.slice(0,20000).match(/\uFFFD/g)||[]).length;
    if (bad > 5) { try { t = new TextDecoder('windows-1251').decode(buf); } catch(e){} }
    return t.replace(/^\uFEFF/,'');
  }

  function readFile(f){
    setStatus('Читаю файл «'+f.name+'»…');
    const r = new FileReader();
    r.onerror = () => setStatus('Не удалось прочитать файл. Попробуйте сохранить его заново и загрузить ещё раз.', true);
    r.onload = () => {
      try {
        let data;
        if (/\.(xlsx|xls)$/i.test(f.name)) {
          const wb = XLSX.read(r.result, {type:'array'});
          const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:'', raw:false});
          data = aoa;
        } else {
          data = Papa.parse(decode(r.result), {skipEmptyLines:true}).data;
        }
        load(data, f.name);
      } catch(e){ setStatus('Файл не распознан: '+e.message, true); }
    };
    r.readAsArrayBuffer(f);
  }

  function findHeaderRow(aoa){
    // header row = first of the top 15 rows with the most non-empty text cells
    let best=0, bestN=-1;
    for (let i=0;i<Math.min(15,aoa.length);i++){
      const n = aoa[i].filter(c=>String(c).trim() && isNaN(Number(c))).length;
      if (n>bestN){best=i;bestN=n;}
    }
    return best;
  }

  function load(aoa, name){
    aoa = aoa.filter(r => r.some(c => String(c).trim()));
    if (aoa.length < 2){ setStatus('В файле нет строк с данными.', true); return; }
    const h = findHeaderRow(aoa);
    cols = aoa[h].map((c,i)=> String(c).trim() || ('Столбец '+(i+1)));
    rows = aoa.slice(h+1).map(r => cols.map((_,i)=> String(r[i] ?? '').trim()));

    addrCol = cols.findIndex(c => /полный адрес/i.test(c));
    if (addrCol<0) addrCol = cols.findIndex(c => /адрес/i.test(c));
    if (addrCol<0){
      let best=-1, bi=0;
      cols.forEach((_,i)=>{ const n = rows.slice(0,300).filter(r=>STREET_RE.test(r[i])).length; if(n>best){best=n;bi=i;} });
      addrCol = bi;
    }
    const pref = [/управляющая организация|наименование организации/i,/тип дома/i,/состояни/i,/общая площадь/i,/помещений всего/i,/год.*(постр|ввод)/i,/этаж/i];
    showCols = [];
    pref.forEach(re=>{ const i = cols.findIndex((c,j)=>re.test(c) && j!==addrCol && !showCols.includes(j)); if(i>=0) showCols.push(i); });
    if (showCols.length<3) cols.forEach((_,i)=>{ if(showCols.length<4 && i!==addrCol && !showCols.includes(i)) showCols.push(i); });
    showCols = showCols.slice(0,5);

    rows.forEach(r => { r._street = streetOf(r[addrCol]); r._lc = r[addrCol].toLowerCase().replace(/ё/g,'е'); });

    const hasSpb = rows.some(r=>/санкт-петербург|спб/i.test(r[addrCol]));
    $('spb').checked = hasSpb; $('spb').disabled = !hasSpb;

    fillStreets();
    $('thead').innerHTML = '<tr><th>Адрес</th><th>Улица</th>'+showCols.map(i=>'<th>'+esc(cols[i])+'</th>').join('')+'</tr>';
    $('panel').classList.add('on');
    setStatus('Загружено: «'+name+'», '+rows.length.toLocaleString('ru-RU')+' строк, '+cols.length+' столбцов. Адрес берётся из столбца «'+cols[addrCol]+'».');
    apply();
  }

  function streetOf(a){
    if(!a) return '';
    const parts = a.split(',').map(s=>s.trim());
    const p = parts.find(s => STREET_RE.test(s+' ') && !/^(г\.?|город|пос|п\.|д\.|дом|корп|стр|лит)/i.test(s));
    return p ? p.replace(/\s+/g,' ') : '';
  }

  function fillStreets(){
    const src = $('spb').checked ? rows.filter(isSpb) : rows;
    const m = new Map();
    src.forEach(r=>{ if(r._street) m.set(r._street,(m.get(r._street)||0)+1); });
    const list = [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ru'));
    const sel = $('street'), cur = sel.value;
    sel.innerHTML = '<option value="">Все улицы ('+list.length.toLocaleString('ru-RU')+')</option>' +
      list.map(([s,n])=>'<option value="'+esc(s)+'">'+esc(s)+' — '+n+'</option>').join('');
    if (m.has(cur)) sel.value = cur;
  }

  const isSpb = r => /санкт-петербург|спб/i.test(r[addrCol]);

  function apply(){
    const terms = $('q').value.toLowerCase().replace(/ё/g,'е').split(/[\s,]+/).filter(Boolean);
    const st = $('street').value, spb = $('spb').checked && !$('spb').disabled;
    filtered = rows.filter(r => (!spb || isSpb(r)) && (!st || r._street===st) && terms.every(t=>r._lc.includes(t)));
    page = 0; openIdx = null; render();
  }

  function hl(text){
    const terms = $('q').value.trim().split(/[\s,]+/).filter(t=>t.length>0);
    let s = esc(text);
    terms.forEach(t=>{ s = s.replace(new RegExp('('+esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); });
    return s;
  }

  function render(){
    const streets = new Set(filtered.map(r=>r._street).filter(Boolean)).size;
    $('summary').innerHTML = '<span><b>'+filtered.length.toLocaleString('ru-RU')+'</b>домов найдено</span><span><b>'+streets.toLocaleString('ru-RU')+'</b>улиц</span><span><b>'+rows.length.toLocaleString('ru-RU')+'</b>строк в файле</span>';
    const pages = Math.max(1, Math.ceil(filtered.length/PAGE));
    const slice = filtered.slice(page*PAGE, page*PAGE+PAGE);
    const tb = $('tbody');
    if (!slice.length){ tb.innerHTML = '<tr><td colspan="'+(2+showCols.length)+'" class="empty">Ничего не найдено. Уберите часть слов из поиска или выберите «Все улицы».</td></tr>'; }
    else tb.innerHTML = slice.map((r,k)=>{
      const idx = page*PAGE+k;
      let h = '<tr class="r" tabindex="0" data-i="'+idx+'" aria-expanded="'+(openIdx===idx)+'"><td class="addr">'+hl(r[addrCol])+'</td><td>'+esc(r._street)+'</td>'+showCols.map(i=>'<td>'+esc(r[i])+'</td>').join('')+'</tr>';
      if (openIdx===idx) h += '<tr class="detail"><td colspan="'+(2+showCols.length)+'"><dl>'+cols.map((c,i)=> r[i] ? '<dt>'+esc(c)+'</dt><dd>'+esc(r[i])+'</dd>' : '').join('')+'</dl></td></tr>';
      return h;
    }).join('');
    $('pageinfo').textContent = 'Страница '+(page+1)+' из '+pages;
    $('prev').disabled = page===0; $('next').disabled = page>=pages-1;
  }

  function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const toggle = tr => { const i=+tr.dataset.i; openIdx = openIdx===i?null:i; render(); };
  $('tbody').addEventListener('click', e=>{ const tr=e.target.closest('tr.r'); if(tr) toggle(tr); });
  $('tbody').addEventListener('keydown', e=>{ const tr=e.target.closest('tr.r'); if(tr && (e.key==='Enter'||e.key===' ')){e.preventDefault();toggle(tr);} });

  let t; $('q').addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(apply,150); });
  $('street').addEventListener('change', apply);
  $('spb').addEventListener('change', ()=>{ fillStreets(); apply(); });
  $('prev').onclick = ()=>{ page--; openIdx=null; render(); };
  $('next').onclick = ()=>{ page++; openIdx=null; render(); };

  const drop=$('drop'), inp=$('file');
  inp.addEventListener('change', ()=> inp.files[0] && readFile(inp.files[0]));
  drop.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click();} });
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) readFile(f); });
})();
</script>
</body>
</html>
