<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Дома Санкт-Петербурга</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div>
          <h1>Дома Санкт-Петербурга</h1>
          <p>Реестр жилищного фонда по данным ГИС ЖКХ</p>
        </div>
      </header>
      <div class="facade" aria-hidden="true"></div>

      <section id="empty" class="drop">
        <h2>Загрузите список домов</h2>
        <p>
          Выберите файл spb_houses.csv или другую выгрузку из ГИС ЖКХ в формате CSV или Excel. Можно просто
          перетащить его сюда.
        </p>
        <label class="btn primary">
          Выбрать файл
          <input type="file" class="hidden" accept=".csv,.txt,.xlsx,.xls" data-file />
        </label>
      </section>
      <p class="status" id="status" role="status"></p>

      <main id="main" class="hidden">
        <form class="search" id="searchForm" role="search" aria-label="Поиск домов">
          <div class="field">
            <label for="q">Адрес или кадастровый номер</label>
            <div class="inp" id="qWrap">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
              </svg>
              <input
                type="search"
                id="q"
                placeholder="Например: Марата 8"
                autocomplete="off"
                enterkeyhint="search"
              />
            </div>
            <p class="hint">Улица и номер дома, можно без «ул.» и «д.»</p>
          </div>
          <button class="btn primary" type="submit" id="searchBtn">Найти</button>
        </form>

        <div class="found">
          <h2 id="foundTitle"></h2>
          <span id="foundSub"></span>
        </div>

        <div class="list" id="list"></div>
        <div class="more"><button class="btn" type="button" id="more"></button></div>
        <p class="source" id="source"></p>
      </main>
    </div>

    <dialog class="sheet" id="dlg" aria-labelledby="dTitle">
      <div class="grab" aria-hidden="true"></div>
      <div class="sh-head">
        <h2 id="dTitle"></h2>
        <button class="x" type="button" id="dClose" aria-label="Закрыть">×</button>
      </div>
      <div class="sh-body" id="dBody"></div>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
